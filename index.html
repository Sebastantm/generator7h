<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Generator plików TXT – dostęp chroniony</title>
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#17252d;--mute:#5d6f78;--line:#cdd8de;--acc:#0b7a75;--acc-ink:#fff;--err:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a1f;--card:#16252c;--ink:#e6eef1;--mute:#93a7b0;--line:#2b3f48;--acc:#37b5ad;--acc-ink:#07201e;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:20px}
main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:14px}
h1{font-size:1.25rem;margin:0}
p{margin:0;color:var(--mute);font-size:.95rem}
label{display:grid;gap:4px;font-size:.9rem;color:var(--mute)}
input,button{font:inherit;border-radius:8px;border:1px solid var(--line);padding:9px 12px;color:var(--ink);background:var(--card);width:100%}
button{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#err{min-height:1.4em;color:var(--err);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>Generator plików TXT</h1>
  <p>Podaj hasło, aby otworzyć narzędzie.</p>
  <form id="f" autocomplete="off">
    <label>Hasło<input type="password" id="pw" autofocus required></label>
    <div id="err" role="alert"></div>
    <button id="go" type="submit">Otwórz</button>
  </form>
</main>

const err = document.getElementById('err'), go = document.getElementById('go');
document.getElementById('f').addEventListener('submit', async e => {

  err.textContent = '';
